    <script>
document.addEventListener('DOMContentLoaded', function() {
    var menu = document.getElementById('main-menu');
    var menuShowBtn = document.getElementById('menu-show-btn');
    // Hide menu by default on all screens
    function updateMenuVisibility() {
        menu.classList.remove('menu-open');
    }
    updateMenuVisibility();
    window.addEventListener('resize', updateMenuVisibility);

    if (menuShowBtn && menu) {
        menuShowBtn.addEventListener('click', function(e) {
            // Only prevent default if you want to toggle menu, not navigate
            if (menu.classList.contains('menu-open')) {
                e.preventDefault();
                menu.classList.toggle('menu-open');
            }
            // Otherwise, allow navigation to index.html
        });
    }
    // Remove all popup link JS
});
    </script>
