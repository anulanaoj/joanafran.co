<div class="sideimage">
    <img src="../search/IMG_5744.jpg" alt="side image">
</div>
<div class="preview" hidden>
    <iframe title="preview"></iframe>
</div>
<script>
    const links = document.querySelectorAll('.list li a');
    const preview = document.querySelector('.preview');
    const frame = preview.querySelector('iframe');
    const sideimage = document.querySelector('.sideimage');
    let activeLink = null;

    function closePreview() {
        preview.hidden = true;
        sideimage.hidden = false;
        frame.src = 'about:blank';
        activeLink.classList.remove('active');
        activeLink = null;
    }

    links.forEach(link => {
        link.addEventListener('click', event => {
            event.preventDefault();
            if (activeLink === link) {
                closePreview();
                return;
            }
            if (activeLink) activeLink.classList.remove('active');
            activeLink = link;
            link.classList.add('active');
            frame.src = link.href;
            preview.hidden = false;
            sideimage.hidden = true;
        });
    });
</script>
</body>
</html>
