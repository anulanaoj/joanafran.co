    </div>

    <script>
document.addEventListener('DOMContentLoaded', function() {
    const gridImages = document.querySelectorAll('.continuous-column.grid img');
    const floatingDesc = document.getElementById('floating-desc');
    const descContent = document.getElementById('desc-content');
    const closeBtn = document.querySelector('.floating-description .close-desc');

    gridImages.forEach(img => {
        img.addEventListener('click', function() {
            let html = img.getAttribute('data-desc-html');
            if (html) {
                descContent.innerHTML = html;
            } else {
                let text = img.getAttribute('data-desc') || '';
                descContent.innerHTML = `<strong>${img.alt}</strong><br>${text}`;
            }
            floatingDesc.style.display = 'block';
        });
    });

    closeBtn.addEventListener('click', function() {
        floatingDesc.style.display = 'none';
        descContent.innerHTML = '';
    });

    document.addEventListener('mousedown', function(e) {
        if (floatingDesc.style.display === 'block' && !floatingDesc.contains(e.target)) {
            floatingDesc.style.display = 'none';
            descContent.innerHTML = '';
        }
    });
});
</script>
