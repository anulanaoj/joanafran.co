<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>joana is working on it</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            height: 100vh;
            width: 100vw;
            background: #fff;
            position: relative;
            display: flex;
            overflow-x: hidden;
        }
        .message {
            position: absolute;
            top: 35%;
            left: 30%;
            font-size: 2rem;
            color: #e74521;
            font-family: "EB Garamond", serif;
  font-optical-sizing: auto;
  font-weight: normal;
  font-style: normal;
            cursor: pointer;
        }
        .contact {
            margin-top: 1rem;
            font-size: 1rem;
            color: #ed0000;
            font-family: "EB Garamond", serif;
  font-optical-sizing: auto;
  font-weight: normal;
  font-style: normal;
            display: none;
        }
        .contact img {
            width: 45vw; /* Set image width to 10vw */
            height: auto;
            display: block;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="message" id="mainMessage">
        joana is working on it
        <div class="contact" id="contactInfo">
            contact me via contact.joanafranco@gmail.com
        <img src="outlinedbodies/outlinedbodies2025-12.png">
        </div>
    </div>
    <script>
        const message = document.getElementById('mainMessage');
        const contact = document.getElementById('contactInfo');
        message.addEventListener('click', function() {
            if (contact.style.display === 'none' || contact.style.display === '') {
                contact.style.display = 'block';
                document.documentElement.style.overflowX = 'hidden';
                document.body.style.overflowX = 'hidden';
            } else {
                contact.style.display = 'none';
                document.documentElement.style.overflowX = '';
                document.body.style.overflowX = '';
            }
        });
    </script>
</body>
</html>
